name: Release

# Push a tag like v0.2.0 (see CONTRIBUTING.md → Releasing). This checks the
# tag matches package.json, runs everything CI runs, publishes to npm with
# provenance through npm Trusted Publishing (OIDC, no npm token stored in
# GitHub), then creates the GitHub Release from the CHANGELOG entry.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      LINEPAY_CHANNEL_ID: ${{ secrets.LINEPAY_CHANNEL_ID }}
      LINEPAY_CHANNEL_SECRET: ${{ secrets.LINEPAY_CHANNEL_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - name: CHANGELOG has an entry for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md || { echo "::error::No '## [${GITHUB_REF_NAME#v}]' section in CHANGELOG.md"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - run: npm run lint:package
      - name: Live sandbox tests
        if: env.LINEPAY_CHANNEL_ID != ''
        run: npm run test:sandbox

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # A GitHub environment, so publishing can require an approval
    # (Settings → Environments → npm → Required reviewers).
    environment: npm
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with Trusted Publishing support
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "**npm:** https://www.npmjs.com/package/linepay-v4/v/$version" >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
