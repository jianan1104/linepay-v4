name: Release

# Push a version tag (see CONTRIBUTING.md → Releasing):
#   npm version patch && git push --follow-tags
# 1. verify:    the tag matches package.json and CHANGELOG.md; every check passes
# 2. npm:       publishes `linepay-v4` to npmjs.com with provenance, through
#               npm Trusted Publishing (OIDC — no npm token stored in GitHub)
# 3. github:    publishes `@jianan1104/linepay-v4` to GitHub Packages
# 4. release:   creates the GitHub Release: notes from CHANGELOG.md, the
#               package tarball and its SHA-256 attached
# A version with a hyphen (0.2.0-beta.1) is published under the `next` tag
# and released as a pre-release.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json version
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: CHANGELOG has an entry for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md || { echo "::error::No '## [${GITHUB_REF_NAME#v}]' section in CHANGELOG.md"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      - name: Smoke test the build (ESM and CommonJS)
        run: |
          node scripts/smoke.mjs
          node scripts/smoke.mjs --cjs
      - run: npm run lint:package
      # The secrets only reach this step, so the unit tests above stay offline.
      - name: Live sandbox tests
        env:
          LINEPAY_CHANNEL_ID: ${{ secrets.LINEPAY_CHANNEL_ID }}
          LINEPAY_CHANNEL_SECRET: ${{ secrets.LINEPAY_CHANNEL_SECRET }}
        run: |
          if [ -z "$LINEPAY_CHANNEL_ID" ]; then echo "::notice::No sandbox credentials; skipped."; exit 0; fi
          npm run test:sandbox
      - name: Pack
        run: |
          npm pack
          sha256sum linepay-v4-*.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            linepay-v4-*.tgz
            SHA256SUMS.txt

  npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    # A GitHub environment, so publishing can require an approval
    # (Settings → Environments → npm → Required reviewers).
    environment:
      name: npm
      url: https://www.npmjs.com/package/linepay-v4/v/${{ needs.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Already on npm?
        # A version published by hand (or a re-run) is skipped, so the tag
        # can still produce the GitHub Packages build and the Release.
        id: published
        run: |
          if npm view "linepay-v4@${{ needs.verify.outputs.version }}" version >/dev/null 2>&1; then
            echo "::notice::linepay-v4@${{ needs.verify.outputs.version }} is already on npm; skipping publish."
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: npm with Trusted Publishing support
        if: steps.published.outputs.yes != 'true'
        run: npm install -g npm@latest
      - if: steps.published.outputs.yes != 'true'
        run: npm ci
      - if: steps.published.outputs.yes != 'true'
        run: npm run build
      - name: Publish
        if: steps.published.outputs.yes != 'true'
        run: npm publish --provenance --access public --tag ${{ needs.verify.outputs.prerelease == 'true' && 'next' || 'latest' }}

  github-packages:
    name: Publish to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@jianan1104"
      - run: npm ci
      - run: npm run build
      - name: Scope the name (GitHub Packages only takes scoped npm packages)
        run: npm pkg set name=@jianan1104/linepay-v4 publishConfig.registry=https://npm.pkg.github.com
      - name: Publish
        run: npm publish --tag ${{ needs.verify.outputs.prerelease == 'true' && 'next' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: GitHub Release
    needs: [verify, npm, github-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: package
      - name: Release notes from CHANGELOG.md
        run: |
          version="${{ needs.verify.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo ""
            echo "### Install"
            echo ""
            echo '```sh'
            echo "npm install linepay-v4@$version"
            echo '```'
            echo ""
            echo "- npm: https://www.npmjs.com/package/linepay-v4/v/$version (with provenance)"
            echo "- GitHub Packages: \`@jianan1104/linepay-v4@$version\`"
            echo "- SHA-256 of the attached tarball: see \`SHA256SUMS.txt\`"
          } >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" linepay-v4-*.tgz SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            ${{ needs.verify.outputs.prerelease == 'true' && '--prerelease' || '' }}
